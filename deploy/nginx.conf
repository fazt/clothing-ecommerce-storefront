# Proxy de producción: un solo origen para la web (Next.js) y la API (Express).
# Las cabeceras de seguridad viven SOLO a nivel de server: ninguna location usa add_header
# (un add_header dentro de una location anularía todos estos). Validar con: nginx -t
upstream atelier_web { server web:5226; keepalive 16; }
upstream atelier_api { server api:4057; keepalive 16; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  # Subidas de imágenes del panel (la API limita a 5 MB por archivo).
  client_max_body_size 8m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /healthz { access_log off; return 200 "ok"; }

  # API, webhooks de pago e imágenes subidas (driver local).
  location /api/ { proxy_pass http://atelier_api; proxy_read_timeout 60s; }
  location /uploads/ { proxy_pass http://atelier_api; }

  location / { proxy_pass http://atelier_web; }
}
